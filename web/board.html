<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beg Board — daily card</title>
    <!--
      Screenshot surface for the daily X post. Standalone on purpose: no shared
      CSS, no fonts to race, one readiness flag for Playwright to wait on.
      Query params: ?api=<worker origin>&limit=10&theme=light|dark
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #fff1e0;
        --card: #fffbf3;
        --text: #1b1626;
        --muted: #6d6280;
        --line: #1b1626;
        --gold: #ffc53d;
        --magenta: #ff3d77;
        --violet: #6c4df6;
        --mint: #7be0c0;
      }
      html[data-theme="dark"] {
        --paper: #15121e;
        --card: #241f36;
        --text: #fff1e0;
        --muted: #a79bc4;
        --line: #f3e7d3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 675px;
        overflow: hidden;
        background: var(--paper);
        color: var(--text);
        font-family: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
        background-image: radial-gradient(color-mix(in srgb, var(--text) 12%, transparent) 1px, transparent 1px);
        background-size: 26px 26px;
        padding: 30px 40px;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 14px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        width: 62px;
        height: 62px;
        display: grid;
        place-items: center;
        font-size: 34px;
        background: var(--gold);
        border: 3px solid var(--line);
        border-radius: 16px;
        box-shadow: 5px 5px 0 var(--line);
        transform: rotate(-4deg);
      }
      h1 {
        margin: 0;
        font-size: 40px;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 16px;
      }
      .total {
        text-align: right;
      }
      .total .n {
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .total .k {
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .podium {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .podium li {
        border: 3px solid var(--line);
        border-radius: 18px;
        box-shadow: 5px 5px 0 var(--line);
        padding: 11px 16px;
        font-size: 19px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
      }
      .podium li:nth-child(1) {
        background: var(--gold);
        color: #26200c;
      }
      .podium li:nth-child(2) {
        background: var(--mint);
        color: #14261f;
      }
      .podium li:nth-child(3) {
        background: var(--magenta);
        color: #fffbf3;
      }
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-auto-rows: min-content;
        gap: 7px;
        align-content: start;
      }
      .rows li {
        background: var(--card);
        border: 3px solid var(--line);
        border-radius: 14px;
        box-shadow: 4px 4px 0 var(--line);
        padding: 5px 16px;
        display: grid;
        grid-template-columns: 52px auto 1fr auto;
        align-items: center;
        gap: 12px;
        font-size: 18px;
      }
      .crown {
        font-size: 26px;
      }
      .rank {
        font-weight: 700;
        opacity: 0.75;
      }
      img.avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--line);
        object-fit: cover;
        background: var(--violet);
      }
      .name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .score {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 15px;
      }
      .stamp {
        border: 3px solid var(--line);
        border-radius: 12px;
        padding: 4px 14px;
        background: var(--violet);
        color: #fffbf3;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <span class="mark">🙏</span>
        <div>
          <h1>Beg Board</h1>
          <p class="sub" id="sub">Who begged hardest for a Codex reset</p>
        </div>
      </div>
      <div class="total">
        <div class="n" id="total">—</div>
        <div class="k">total begs</div>
      </div>
    </header>

    <ol class="podium" id="podium"></ol>
    <ol class="rows" id="rows"></ol>

    <footer>
      <span id="stamp-left">beg-board</span>
      <span class="stamp">@thsottiaux — the people have spoken</span>
    </footer>

    <script>
      const params = new URLSearchParams(location.search);
      const api = (params.get("api") || "").replace(/\/+$/, "");
      const limit = Number(params.get("limit") || 10);
      document.documentElement.dataset.theme = params.get("theme") === "dark" ? "dark" : "light";

      const nf = new Intl.NumberFormat("en-US");
      const flag = (cc) =>
        /^[A-Za-z]{2}$/.test(cc || "")
          ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 127397 + c.charCodeAt(0)))
          : "";

      function avatarEl(entry) {
        const img = document.createElement("img");
        img.className = "avatar";
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        if (entry.avatar) img.src = entry.avatar;
        return img;
      }

      function render(data) {
        document.getElementById("total").textContent = nf.format(data.total || 0);
        document.getElementById("sub").textContent =
          `${nf.format(data.beggars || (data.board || []).length)} beggars · ${new Date(
            data.generated_at || Date.now(),
          ).toUTCString().slice(0, 16)}`;
        // The card is the only place the address appears: a link in the post
        // itself costs 13x more to send and gets downranked, so the image
        // carries it instead. board.html is served from the site, so it can
        // work out its own address.
        const dir = location.pathname.replace(/[^/]*$/, "").replace(/\/$/, "");
        document.getElementById("stamp-left").textContent = api
          ? `${location.host}${dir}`
          : "demo data";

        const board = (data.board || []).slice(0, limit);
        const podium = document.getElementById("podium");
        const rows = document.getElementById("rows");
        podium.textContent = "";
        rows.textContent = "";

        board.slice(0, 3).forEach((entry, i) => {
          const li = document.createElement("li");
          const crown = document.createElement("span");
          crown.className = "crown";
          crown.textContent = ["👑", "🥈", "🥉"][i];
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = `${entry.username} ${flag(entry.country)}`;
          const score = document.createElement("span");
          score.className = "score";
          score.textContent = nf.format(entry.count);
          li.append(crown, name, score);
          podium.appendChild(li);
        });

        board.slice(3).forEach((entry) => {
          const li = document.createElement("li");
          const rank = document.createElement("span");
          rank.className = "rank";
          rank.textContent = `#${entry.rank}`;
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = `${entry.username} ${flag(entry.country)}`;
          const score = document.createElement("span");
          score.className = "score";
          score.textContent = nf.format(entry.count);
          li.append(rank, avatarEl(entry), name, score);
          rows.appendChild(li);
        });

        // Only claim readiness once the webfont has actually landed, or the
        // screenshot catches the fallback face mid-swap.
        document.fonts.ready.then(() => {
          document.body.dataset.ready = "1";
        });
      }

      const sample = {
        total: 128430,
        beggars: 12,
        generated_at: new Date().toISOString(),
        board: [
          ["ratelimited", "TW", 21044], ["tokenburner", "US", 18320], ["ctx_window", "JP", 15877],
          ["nightlybuild", "DE", 12004], ["promptgoblin", "BR", 10933], ["yak_shaver", "GB", 9120],
          ["four_o_four", "IN", 8455], ["semicolon", "FR", 7301], ["cachemiss", "KR", 6688],
          ["bikeshedder", "NL", 5402],
        ].map(([username, country, count], i) => ({ rank: i + 1, uid: `s${i}`, username, country, count, avatar: "" })),
      };

      // The sample exists so the card can be previewed with no backend. It must
      // NEVER stand in for a failed fetch: this page is screenshotted and posted
      // publicly, and publishing invented names and scores as if they were real
      // is far worse than posting nothing. A failure marks the page as errored
      // and the screenshot step refuses to proceed.
      function fail(reason) {
        document.getElementById("total").textContent = "—";
        document.getElementById("sub").textContent = `data unavailable: ${reason}`;
        document.body.dataset.ready = "error";
        document.body.dataset.error = reason;
      }

      (async () => {
        if (!api) return render(sample);
        try {
          const res = await fetch(`${api}/api/leaderboard?limit=${limit}`, { cache: "no-store" });
          if (!res.ok) return fail(`HTTP ${res.status}`);
          const data = await res.json();
          if (!data || !Array.isArray(data.board)) return fail("malformed response");
          render(data);
        } catch (err) {
          fail(String(err && err.message ? err.message : err));
        }
      })();
    </script>
  </body>
</html>
