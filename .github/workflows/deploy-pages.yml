name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # config.js holds only public values, but keeping the Worker origin in a
      # repo variable means the API can move without a code change.
      - name: Inject API base
        if: vars.API_BASE != ''
        run: |
          printf 'window.TIBO_BEG_CONFIG = { API_BASE: "%s" };\n' "${{ vars.API_BASE }}" > web/config.js

      # Stamp the commit onto every asset URL so a deploy swaps the whole set at
      # once. GitHub Pages sends `Cache-Control: max-age=600` on everything and
      # does not allow custom headers, so without this each file carries its own
      # independent ten-minute cache and a browser can end up running a new
      # app.js against a cached i18n.js. That mixed state does not throw -- it
      # shows up as strings quietly rendering blank, which is the kind of bug
      # nobody reports.
      #
      # It does NOT make a deploy instant: index.html has the same ten-minute
      # cache, and until it revalidates the browser never sees the new query
      # strings. What this buys is that when the HTML does refresh, everything
      # it points at refreshes with it.
      #
      # Only CI rewrites these; the files in the repo stay plain, so the local
      # server and the Playwright suites load them unversioned.
      - name: Version the assets
        run: |
          v="${GITHUB_SHA::8}"
          # Matched by shape, not by filename, so an asset added later is
          # stamped without anyone remembering this step exists. Either quote
          # style, because the one that gets missed is the one nobody checks.
          sed -i -E "s#(src|href)=([\"'])\./([^\"'?]+)\2#\1=\2./\3?v=$v\2#g" web/*.html
          # app.js imports i18n.js itself, so rewriting the HTML is not enough.
          sed -i -E "s#from ([\"'])\./([^\"'?]+)\1#from \1./\2?v=$v\1#g" web/*.js
          # The invariant, checked rather than assumed: nothing local is left
          # unstamped. A failed deploy beats one file quietly serving a stale
          # copy for ten minutes after every release.
          ! grep -rnE "(src|href)=[\"']\./[^\"'?]*[\"']" web/*.html
          ! grep -rnE "from [\"']\./[^\"'?]*[\"']" web/*.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
